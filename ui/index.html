<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提示词积木 · 分块组装版</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="mark">▦</span><div><h1>提示词积木 <small>独立新版</small></h1><p>把灵感分块，把配方留住</p></div></div><div class="actions"><label class="theme-picker">配色 <select id="themeSelect" aria-label="界面配色"><option value="forest">深林绿</option><option value="midnight">午夜蓝</option><option value="violet">雾紫夜</option><option value="ember">暖炭金</option><option value="paper">奶油纸 · 浅色</option><option value="mist">雾白青 · 浅色</option></select></label><span id="saveStatus" role="status">正在载入…</span><button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Shift+Z">↷</button><button id="backup">导出备份</button><button id="restore">导入备份</button><button id="help">使用说明</button></div></header>
<div class="project-bar"><span class="eyebrow">当前方案</span><select id="schemeSelect" aria-label="当前方案"></select><button id="newScheme">＋ 新方案</button><button id="renameScheme">重命名</button><button id="duplicateScheme" title="完整保留当前分块，保存为新的独立方案">另存为方案</button><button id="deleteScheme" class="quiet">删除方案</button><span class="spacer"></span><button id="translationSettings">翻译 / 润色设置</button><span id="schemeCount"></span></div>
<main><aside class="panel library"><div class="panel-heading"><h2>素材库 <small id="libraryCount"></small></h2><button id="favoriteOnly" aria-pressed="false">☆ 收藏</button></div><div class="tabs"><button id="libraryTab" class="active">词条</button><button id="templateTab">组合块 <span id="templateCount"></span></button><button id="bundleTab">词库配方</button></div>
<div class="search"><input id="search" placeholder="搜索中文、英文或组合名称" aria-label="搜索素材"><button id="clearSearch" aria-label="清空搜索">×</button></div>
<div id="wordFilters" class="filters"><select id="category" aria-label="词库分类"><option value="">全部分类</option></select><select id="group" aria-label="词库子分类"><option value="">全部子分类</option></select></div>
<div id="bundleFilters" class="hidden"><select id="bundleSource" aria-label="配方来源"><option value="">全部来源</option></select></div>
<div id="templateTools" class="hidden"><div class="filters"><select id="templatePurpose" aria-label="按组合用途筛选"></select><select id="templateIP" aria-label="按组合IP出处筛选"></select></div><button id="importTemplate">＋ 粘贴并保存组合块</button></div>
<div class="target"><span id="targetName">添加到选中块</span><div class="segmented"><button id="positiveTarget" class="active">正面</button><button id="negativeTarget">负面</button></div></div>
<div class="list-caption"><span id="resultCount"></span><span id="libraryHint">＋ 添加 · ✓ 取消</span></div><div id="results" class="scroll"></div><button id="more" hidden>显示更多</button></aside>
<section class="panel workspace"><div class="panel-heading"><div><span class="eyebrow">ASSEMBLE</span><h2>分块组装 <small id="blockCount"></small></h2></div><button id="addBlock" class="primary">＋ 新建块</button></div><div class="language-bar"><button id="editCharacters">角色定义 <span id="characterCount">0</span></button><span id="characterSummary">先定义 A、B，再写互动</span><button id="addProse">＋ 自然语言</button><button id="languageDemo">看书示例</button><button id="handholdingDemo">牵手示例</button></div><div class="workspace-tools"><span>点卡片选中，词库内容加入该块</span><button id="agentTemplateImport">按模板导入</button><button id="paste">粘贴提示词</button><button id="foldAll">全部折叠</button></div><div id="blocks" class="scroll"></div><div class="workspace-footer"><span>拖动 ⋮⋮ 排序 · 块内编辑只影响当前方案</span><button id="saveSchemeTemplate" title="保存到左侧组合库，不会增加顶部方案选项">整套存入组合库</button></div></section>
<aside class="panel output"><div class="panel-heading"><div><span class="eyebrow">EXPORT</span><h2>最终文本</h2></div><select id="format" aria-label="输出格式"><option value="comfy">SD / ComfyUI</option><option value="nai">NovelAI</option><option value="plain">纯文本</option></select></div><p id="formatNote" class="muted"></p>
<div class="output-heading"><label for="positiveOutput">正面 <small id="positiveCount"></small></label><button id="copyPositive" class="primary">复制正面</button></div><textarea id="positiveOutput" readonly spellcheck="false"></textarea>
<div class="output-heading"><label for="negativeOutput">负面 <small id="negativeCount"></small></label><button id="copyNegative">复制负面</button></div><textarea id="negativeOutput" readonly spellcheck="false"></textarea>
<div id="warnings" role="status"></div><details id="sourceDetails"><summary>查看词条来源</summary><div id="sourceList"></div></details>
<div class="parameter-heading"><h3>配方参数</h3><button id="editParams">编辑</button></div><div id="parameters"></div><button id="exportScheme">导出当前配方 JSON</button></aside></main>
<footer><span><i></i>本地独立保存 · 旧版不受影响</span><span>组合只负责文本组装，模型参数供查阅与复制</span></footer><div id="toast" role="status"></div>
<dialog id="modal"><form method="dialog" id="modalForm"><div class="dialog-heading"><h2 id="modalTitle"></h2><button value="cancel" aria-label="关闭弹窗">×</button></div><div id="modalBody"></div><p id="modalError" role="alert"></p><div class="dialog-actions"><button value="cancel">取消</button><button id="modalConfirm" value="ok" class="primary">保存</button></div></form></dialog>
<script src="parser.js"></script><script src="model.js"></script><script src="language.js"></script><script src="workspace-tools.js"></script><script src="bundles.js"></script><script src="agent-template.js"></script><script src="block-search.js"></script><script src="template-filters.js"></script><script src="app.js"></script></body></html>
